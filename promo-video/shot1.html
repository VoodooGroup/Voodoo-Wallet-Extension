<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Voodoo Wallet — Shot 1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #07060c;
    color: #fff;
  }
  body {
    background:
      radial-gradient(ellipse 900px 600px at 18% 40%, rgba(236, 72, 153, 0.22), transparent 55%),
      radial-gradient(ellipse 800px 500px at 85% 70%, rgba(124, 58, 237, 0.18), transparent 50%),
      linear-gradient(160deg, #0a0812 0%, #120a1a 45%, #08070e 100%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 80px 100px;
  }
  .left { max-width: 920px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 10px 20px;
    font-size: 22px;
    letter-spacing: 0.04em;
    color: #f9a8d4;
    margin-bottom: 36px;
  }
  h1 {
    font-size: 92px;
    line-height: 1.05;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  h1 span { color: #f472b6; }
  .sub {
    font-size: 34px;
    line-height: 1.4;
    color: rgba(255,255,255,0.82);
    max-width: 820px;
    font-weight: 400;
  }
  .right {
    width: 520px; height: 520px;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .glow {
    position: absolute;
    width: 460px; height: 460px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(236,72,153,0.35), transparent 70%);
    filter: blur(8px);
  }
  .logo-wrap {
    width: 380px; height: 380px;
    border-radius: 50%;
    overflow: hidden;
    border: 6px solid rgba(255,255,255,0.12);
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 60px rgba(236,72,153,0.25);
    position: relative; z-index: 1;
    background: #000;
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .footer {
    position: absolute; bottom: 48px; left: 100px; right: 100px;
    display: flex; justify-content: space-between; align-items: center;
    color: rgba(255,255,255,0.45); font-size: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f472b6; display: inline-block; margin-right: 10px; }
</style>
</head>
<body>
  <div class="left">
    <div class="badge">Chrome browser extension</div>
    <h1>Meet <span>Voodoo Wallet</span></h1>
    <p class="sub">Your simple PulseChain wallet — right in your browser. Easy to use. Built for everyday crypto.</p>
  </div>
  <div class="right">
    <div class="glow"></div>
    <div class="logo-wrap">
      <img src="../public/voodoo-wallet-logo.jpg" alt="Voodoo Wallet logo" />
    </div>
  </div>
  <div class="footer">
    <span><span class="dot"></span>Non-custodial · Your keys, your control</span>
    <span>voodootoken.com</span>
  </div>
</body>
</html>
