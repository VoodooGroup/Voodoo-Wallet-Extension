<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Voodoo Wallet — Send</title>
<link rel="stylesheet" href="../dist/assets/index-BL1ukM1j.css" />
<link rel="stylesheet" href="real-ui-shell.css" />
<style>
  html, body {
    width: 1920px !important; max-width: none !important; min-width: 0 !important;
    height: 1080px !important; max-height: none !important; min-height: 0 !important;
    overflow: hidden !important; background: #061820 !important;
  }
  .phone-inner {
    --wallpaper-fallback: #0a2f3a;
    --wallpaper-image: url("../dist/public/voodoo-token-background.png");
  }
  .phone-inner .app-shell { background-size: cover; background-position: center; }
  .phone-inner .app-scroll {
    background-size: cover; background-position: center; overflow: hidden; flex: 1;
  }
  .phone-inner input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: 10px; font-size: 13px; background: #fff;
  }
  .phone-inner .label { font-size: 12px; font-weight: 600; margin: 8px 0 6px; color: var(--muted); }
  .phone-inner .btn {
    width: 100%; border: none; border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <div class="kicker">Send &amp; receive</div>
      <h1>Move PLS and tokens in a few taps</h1>
      <p>Pick an asset, paste an address, review the send — clear and simple.</p>
      <div class="brand">
        <img src="../dist/public/voodoo-wallet-logo.jpg" alt="" />
        <span>Real product UI · PulseChain only</span>
      </div>
    </div>
    <div class="phone">
      <div class="phone-inner">
        <div class="app app-shell" style="display:flex;flex-direction:column;height:560px;">
          <div class="header">
            <div class="header-inner">
              <div class="header-brand">
                <img src="../dist/public/voodoo-wallet-logo.jpg" alt="Voodoo Wallet" class="header-brand-logo" width="52" height="52" style="border-radius:12px;object-fit:cover;" />
                <div>
                  <h1 style="font-size:16px;margin:0;">Voodoo Wallet</h1>
                  <p class="header-network" style="display:flex;align-items:center;gap:6px;margin:2px 0 0;font-size:12px;color:var(--muted);">
                    <img src="../dist/public/pulsechain-logo-40.png" alt="" width="16" height="16" />
                    PulseChain
                  </p>
                </div>
              </div>
              <button type="button" class="header-menu-btn" aria-label="Menu">
                <span class="header-menu-line"></span>
                <span class="header-menu-line"></span>
                <span class="header-menu-line"></span>
              </button>
            </div>
          </div>
          <div class="app-scroll" style="flex:1;overflow:hidden;">
            <div class="content">
              <div class="card send-card">
                <div class="label">Asset</div>
                <div class="send-asset-select" style="display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel2);">
                  <span class="token-dot dot-pls">PLS</span>
                  <strong style="font-size:14px;">PLS</strong>
                </div>

                <div class="label">Recipient</div>
                <input value="0xA1b2…8fE4" readonly />

                <div class="label">Amount</div>
                <input value="100" readonly />

                <p class="muted" style="margin:4px 0 12px;">Est. gas ≈ 0.004200 PLS</p>

                <button type="button" class="btn btn-primary">Review send</button>
              </div>
            </div>
          </div>
          <div class="nav">
            <div class="nav-row">
              <button type="button">Home</button>
              <button type="button">Swap</button>
              <button type="button" class="active">Send</button>
              <button type="button">Receive</button>
            </div>
            <div class="nav-row nav-row-secondary">
              <button type="button">Stake</button>
              <button type="button">Activity</button>
              <button type="button">Accounts</button>
              <button type="button">Settings</button>
            </div>
            <p class="nav-version">v1.0.6</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
