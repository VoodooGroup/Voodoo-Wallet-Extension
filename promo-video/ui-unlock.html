<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Voodoo Wallet — Unlock</title>
<link rel="stylesheet" href="../dist/assets/index-BL1ukM1j.css" />
<link rel="stylesheet" href="real-ui-shell.css" />
<style>
  html, body {
    width: 1920px !important; max-width: none !important; min-width: 0 !important;
    height: 1080px !important; max-height: none !important; min-height: 0 !important;
    overflow: hidden !important; background: #061820 !important;
  }
  .phone-inner {
    --wallpaper-fallback: #0a2f3a;
    --wallpaper-image: url("../dist/public/voodoo-token-background.png");
  }
  .phone-inner .app-auth {
    background-color: var(--wallpaper-fallback);
    background-image: var(--wallpaper-image);
    background-size: cover;
    background-position: center;
    height: 560px;
    display: flex;
    flex-direction: column;
  }
  .phone-inner input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: 10px; font-size: 13px; background: #fff;
  }
  .phone-inner .label { font-size: 12px; font-weight: 600; margin: 8px 0 6px; color: var(--muted); }
  .phone-inner .btn {
    width: 100%; border: none; border-radius: 10px; padding: 12px; font-weight: 600; cursor: pointer;
  }
  .welcome-logo { width: 120px; height: 120px; object-fit: contain; margin: 0 auto 8px; display: block; }
</style>
</head>
<body>
  <div class="stage">
    <div class="copy">
      <div class="kicker">Non-custodial Chrome wallet</div>
      <h1>Meet Voodoo Wallet</h1>
      <p>Your PulseChain wallet in the browser. Password vault. Keys stay on your device.</p>
      <div class="brand">
        <img src="../dist/public/voodoo-wallet-logo.jpg" alt="" />
        <span>Real product UI · PulseChain only</span>
      </div>
    </div>
    <div class="phone">
      <div class="phone-inner">
        <div class="app app-wallpaper app-auth">
          <div class="header header-centered welcome-header" style="text-align:center;padding:24px 16px 8px;background:transparent;border:none;">
            <img src="../dist/public/voodoo-letter-logo.png" alt="Voodoo" class="welcome-logo" width="120" height="120" />
            <h1 class="welcome-title" style="font-size:22px;margin:8px 0 4px;color:#fff;">Welcome back</h1>
            <p class="muted welcome-tagline" style="color:rgba(255,255,255,0.85);margin:0;">Unlock your wallet</p>
          </div>
          <form class="content auth-content" style="padding:16px;">
            <div class="card" style="margin-top:8px;">
              <label class="label" for="pw">Password</label>
              <input id="pw" type="password" value="••••••••" readonly />
              <button type="button" class="btn btn-primary">Unlock</button>
              <p class="muted" style="text-align:center;margin-top:12px;">Auto-lock keeps you safe</p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
