<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Voodoo Wallet — Shot 3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #fff;
  }
  body {
    background:
      radial-gradient(ellipse 900px 700px at 50% 45%, rgba(236, 72, 153, 0.18), transparent 60%),
      radial-gradient(ellipse 600px 400px at 80% 20%, rgba(124, 58, 237, 0.2), transparent 50%),
      linear-gradient(165deg, #0a0812 0%, #140a1c 55%, #08070e 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    text-align: center;
  }
  .logo {
    width: 160px; height: 160px;
    border-radius: 50%;
    overflow: hidden;
    border: 4px solid rgba(255,255,255,0.15);
    box-shadow: 0 16px 50px rgba(0,0,0,0.5), 0 0 40px rgba(236,72,153,0.3);
    margin-bottom: 36px;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  h2 {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 18px;
  }
  .lead {
    font-size: 30px;
    color: rgba(255,255,255,0.8);
    max-width: 1100px;
    line-height: 1.4;
    margin-bottom: 48px;
  }
  .pills {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 56px;
  }
  .pill {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 16px 32px;
    font-size: 24px;
    font-weight: 600;
  }
  .pill strong { color: #f472b6; font-weight: 700; }
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(90deg, #db2777, #7c3aed);
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    padding: 22px 48px;
    border-radius: 16px;
    box-shadow: 0 16px 40px rgba(219, 39, 119, 0.35);
    margin-bottom: 28px;
  }
  .tagline {
    font-size: 26px;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
  <div class="logo">
    <img src="../public/voodoo-wallet-logo.jpg" alt="Voodoo Wallet" />
  </div>
  <h2>Stake VDO. Connect to apps.</h2>
  <p class="lead">Stake your VDO tokens, connect to PulseChain dApps, and manage crypto without leaving Chrome.</p>
  <div class="pills">
    <div class="pill"><strong>Stake</strong> VDO</div>
    <div class="pill"><strong>Connect</strong> dApps</div>
    <div class="pill"><strong>Secure</strong> vault</div>
  </div>
  <div class="cta">Try Voodoo Wallet today</div>
  <p class="tagline">Secure · Simple · PulseChain ready</p>
</body>
</html>
